<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">The weekly backup, and the hole it had</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">Spec 43 phase 3 · ADR 037 · spec 45 phase 1. The database is the only irreplaceable state.</text>

  <!-- flow -->
  <rect x="60" y="90" width="230" height="120" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="80" y="122" font-size="11.5" font-weight="bold" fill="#f8fafc">1 · pg_dump</text>
  <text x="80" y="146" font-size="10.5" fill="#cbd5e1">Every Sunday, custom format,</text>
  <text x="80" y="164" font-size="10.5" fill="#cbd5e1">compressed, from the live</text>
  <text x="80" y="182" font-size="10.5" fill="#cbd5e1">production database</text>

  <line x1="290" y1="150" x2="322" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="330" y="90" width="230" height="120" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="350" y="122" font-size="11.5" font-weight="bold" fill="#f8fafc">2 · age encrypt</text>
  <text x="350" y="146" font-size="10.5" fill="#cbd5e1">Encrypted before it lands</text>
  <text x="350" y="164" font-size="10.5" fill="#cbd5e1">anywhere — readable only with</text>
  <text x="350" y="182" font-size="10.5" fill="#cbd5e1">the household's key</text>

  <line x1="560" y1="150" x2="592" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="90" width="230" height="120" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="620" y="122" font-size="11.5" font-weight="bold" fill="#f8fafc">3 · same-site vault</text>
  <text x="620" y="146" font-size="10.5" fill="#cbd5e1">A second drive at home,</text>
  <text x="620" y="164" font-size="10.5" fill="#cbd5e1">keeping the seven newest</text>
  <text x="620" y="182" font-size="10.5" fill="#cbd5e1">(≈ 49 days)</text>

  <line x1="830" y1="150" x2="862" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="870" y="90" width="270" height="120" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="890" y="122" font-size="11.5" font-weight="bold" fill="#f8fafc">4 · prune, safely</text>
  <text x="890" y="146" font-size="10.5" fill="#cbd5e1">Old dumps are deleted only</text>
  <text x="890" y="164" font-size="10.5" fill="#cbd5e1">after the new one is written</text>
  <text x="890" y="182" font-size="10.5" fill="#cbd5e1">and verified</text>

  <!-- the hole -->
  <rect x="60" y="246" width="1080" height="110" rx="10" fill="#1a1410" stroke="#40341f"/>
  <text x="84" y="276" font-size="11.5" font-weight="bold" fill="#f6c453">WHAT SPEC 45 PHASE 1 FIXED</text>
  <text x="84" y="300" font-size="10.5" fill="#cbd5e1">Shell pipelines do not fail the way people expect: with no `pipefail`, a dead or empty database still produced a valid-looking .age file — and retention would then</text>
  <text x="84" y="318" font-size="10.5" fill="#cbd5e1">delete the newest good backup to make room for it. The script now refuses to write a backup from an empty dump, and prunes only after a verified write.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="600" y="392" text-anchor="middle" font-size="10.5" fill="#64748b">Drawn from e216fc6 (2026-11-16) · 64a9932 (2026-11-17) · decisions/037-backup-strategy.md · docs/backup-restore.md · scripts/backup-db.sh</text>
</svg>
