name: CI

on:
  push:
  pull_request:

jobs:
  e2e-dependencies:
    name: E2E dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audiobook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d audiobook_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm audit --audit-level=high
        working-directory: server
      - run: npx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/audiobook_test?schema=public
      - run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/audiobook_test?schema=public
      - run: npm test
        working-directory: server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/audiobook_test?schema=public

  client:
    name: Client tests and copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm audit --audit-level=high
        working-directory: client
      # The copy gate runs first: it is fast, and it is the rule most likely to
      # be broken by a one-line edit.
      - run: npm run check:copy
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npx tsc -b
        working-directory: client
