# Production-style deployment: one container serves the built client + API.
# Usage: docker compose -f docker-compose.prod.yml up --build
services:
  app-data-permissions:
    image: node:24-bookworm-slim
    user: "0:0"
    command: ["sh", "-c", "chown -R node:node /data"]
    restart: "no"
    volumes:
      - app_data:/data

  app:
    depends_on:
      app-data-permissions:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: file:/data/library.db
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD before deploying}
      COVER_DIR: /data/covers
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - app_data:/data
      - ${MEDIA_PATH:-./test}:/media:ro

volumes:
  app_data:
