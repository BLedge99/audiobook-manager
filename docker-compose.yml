services:
  client:
    depends_on:
      server:
        condition: service_healthy
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.client
    working_dir: /app/client
    command: npm run dev -- --host
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://server:3000

  server:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.server
    working_dir: /app/server
    # Local development uses SQLite; production uses PostgreSQL. Prisma bakes
    # the datasource provider into the generated client, so both the generate
    # and the migrate command must name the SQLite schema explicitly. Running
    # the bare commands would generate a PostgreSQL client and try to replay
    # PostgreSQL SQL against the SQLite file.
    #
    # `prisma migrate deploy`, NOT `prisma db push`: db push records no
    # migration history and cannot run a data migration, so dev and production
    # would disagree about what the database contained.
    #
    # The exit code is echoed rather than checked, so a failure is visible in
    # the logs without taking the whole stack down.
    command: sh -c "echo '[compose] generating the SQLite Prisma client'; npx prisma generate --schema prisma/sqlite/schema.prisma; echo '[compose] prisma generate exited with code '$$?; echo '[compose] applying SQLite migrations'; npx prisma migrate deploy --schema prisma/sqlite/schema.prisma; echo '[compose] prisma migrate deploy exited with code '$$?; echo '[compose] starting Fastify'; npm run dev"
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
      - ./test:/test:ro
      - audiobook_data:/data/audiobooks
      - app_data:/app/data
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:/app/data/library.db
      - LIBRARY_ROOT=/data/audiobooks
      # The E2E security suite asserts that unauthenticated API calls are
      # rejected, which only holds when auth is actually enabled.
      - APP_PASSWORD=${APP_PASSWORD:-household}
      # Development-only signing key; production Compose requires a unique
      # MEDIA_TOKEN_SECRET from the private .env file.
      - MEDIA_TOKEN_SECRET=${MEDIA_TOKEN_SECRET:-development-only-media-token-secret-32-bytes}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      # Spec 28: passkeys are WebAuthn, so the RP id and the page origin must
      # agree. Vite serves the client on localhost:5173, which is a secure
      # context; the household deployment overrides both with books.home.arpa.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  client_node_modules:
  server_node_modules:
  audiobook_data:
  app_data:
