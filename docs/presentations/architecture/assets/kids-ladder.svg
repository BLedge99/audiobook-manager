<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">How a child signs in — and what they never see</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">Spec 38 · ADR 033 · one server-side rule decides visibility, everywhere.</text>

  <!-- ladder -->
  <rect x="60" y="84" width="300" height="240" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="80" y="112" font-size="11.5" font-weight="bold" fill="#f8fafc">The age ladder</text>
  <text x="80" y="138" font-size="11" fill="#cbd5e1">under 6 · 6–9 · 10–13 · 14–17</text>
  <text x="80" y="168" font-size="10.5" fill="#94a3b8">A band is chosen per child account —</text>
  <text x="80" y="186" font-size="10.5" fill="#94a3b8">never a date of birth.</text>
  <text x="80" y="216" font-size="10.5" fill="#94a3b8">Books carry a minimum age; an admin-</text>
  <text x="80" y="234" font-size="10.5" fill="#94a3b8">managed blocklist hides genres outright.</text>
  <text x="80" y="264" font-size="10.5" fill="#94a3b8">Provider age guesses are suggestions only.</text>

  <!-- predicate -->
  <rect x="430" y="84" width="330" height="240" rx="10" fill="#1a2740" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="450" y="112" font-size="11.5" font-weight="bold" fill="#f8fafc">One visibility predicate</text>
  <text x="450" y="138" font-size="10.5" fill="#cbd5e1">Lives in server/src/age/ and is used by</text>
  <text x="450" y="156" font-size="10.5" fill="#cbd5e1">every surface that shows a book:</text>
  <text x="450" y="184" font-size="10" fill="#94a3b8">grid · detail · stream · covers · favourites</text>
  <text x="450" y="202" font-size="10" fill="#94a3b8">history · review queue · taxonomy counts</text>
  <text x="450" y="230" font-size="10.5" fill="#cbd5e1">Enforced server-side, fail-closed. A hidden</text>
  <text x="450" y="248" font-size="10.5" fill="#cbd5e1">book answers 404 — it does not confirm it exists.</text>

  <!-- result -->
  <rect x="830" y="84" width="310" height="240" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="850" y="112" font-size="11.5" font-weight="bold" fill="#f8fafc">On the child's phone</text>
  <text x="850" y="138" font-size="10.5" fill="#cbd5e1">The offline replica applies the same</text>
  <text x="850" y="156" font-size="10.5" fill="#cbd5e1">ladder — downloaded books stay in band.</text>
  <text x="850" y="186" font-size="10.5" fill="#cbd5e1">The session carries the band, so every</text>
  <text x="850" y="204" font-size="10.5" fill="#cbd5e1">request is filtered, not just the grid.</text>
  <text x="850" y="234" font-size="10.5" fill="#94a3b8">New child accounts start with an empty</text>
  <text x="850" y="252" font-size="10.5" fill="#94a3b8">shelf until an adult presses “Add all</text>
  <text x="850" y="270" font-size="10.5" fill="#94a3b8">age-appropriate books” in the admin panel.</text>

  <line x1="360" y1="204" x2="422" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="760" y1="204" x2="822" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="600" y="380" text-anchor="middle" font-size="10.5" fill="#64748b">Drawn from aa91bbf..6bf608f (2026-11-12) · specs/38-child-accounts.md · ADR 033 · GDPR-AUDIT activity 12</text>
</svg>
