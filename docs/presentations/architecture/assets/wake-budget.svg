<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">Spec 42, card 1 — one wake budget</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">The week's wake/retry code existed in three incompatible forms. Now it is one module with constants both the server-waking flow and the player use.</text>

  <!-- timeline -->
  <line x1="80" y1="170" x2="1120" y2="170" stroke="#334155" stroke-width="3"/>

  <circle cx="140" cy="170" r="34" fill="#131c2b" stroke="#22d3ee" stroke-width="2"/>
  <text x="140" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">t+0</text>
  <text x="140" y="184" text-anchor="middle" font-size="8.5" fill="#94a3b8">probe</text>

  <circle cx="400" cy="170" r="34" fill="#131c2b" stroke="#22d3ee" stroke-width="2"/>
  <text x="400" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">t+FAST</text>
  <text x="400" y="184" text-anchor="middle" font-size="8.5" fill="#94a3b8">re-probe</text>

  <circle cx="660" cy="170" r="34" fill="#131c2b" stroke="#f6c453" stroke-width="2"/>
  <text x="660" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#f6c453">t+TIMEOUT</text>
  <text x="660" y="184" text-anchor="middle" font-size="8.5" fill="#94a3b8">give up, show Waking</text>

  <circle cx="930" cy="170" r="34" fill="#131c2b" stroke="#334155" stroke-width="2"/>
  <text x="930" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#94a3b8">t+BACKOFF</text>
  <text x="930" y="184" text-anchor="middle" font-size="8.5" fill="#94a3b8">retry ladder, capped</text>

  <text x="140" y="230" text-anchor="middle" font-size="10" fill="#cbd5e1">FAST_PROBE_MS</text>
  <text x="400" y="230" text-anchor="middle" font-size="10" fill="#cbd5e1">WAKE_TIMEOUT_MS</text>
  <text x="660" y="230" text-anchor="middle" font-size="10" fill="#cbd5e1">WAKE_BACKOFF_MS</text>

  <text x="600" y="286" text-anchor="middle" font-size="10.5" fill="#cbd5e1">lib/wakeBudget.ts — one home for the three constants, imported by useSession (the waking screen) and ChapterPlayer (the stream retry ladder).</text>
  <text x="600" y="306" text-anchor="middle" font-size="10.5" fill="#94a3b8">The Retry button on the Waking screen worked again because a forced re-probe cancels the parked wake probe instead of racing it (step 1.2), and the wake ladder no longer resets itself on its own retries (step 1.4).</text>
  <text x="600" y="326" text-anchor="middle" font-size="10" fill="#94a3b8">Spec 42 phase 2 rode along: the service worker no longer reloads mid-chapter — the update waits for playback to idle (never mid-listen).</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
