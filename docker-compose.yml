services:
  client:
    depends_on:
      server:
        condition: service_healthy
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.client
    working_dir: /app/client
    command: npm run dev -- --host
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://server:3000

  server:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.server
    working_dir: /app/server
    command: sh -c "echo '[compose] starting prisma generate'; npx prisma generate; echo '[compose] prisma generate exited with code '$$?; echo '[compose] starting prisma db push'; npx prisma db push --accept-data-loss; echo '[compose] prisma db push exited with code '$$?; echo '[compose] starting Fastify'; npm run dev"
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
      - ./test:/test:ro
      - audiobook_data:/data/audiobooks
      - app_data:/app/data
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:/app/data/library.db
      - LIBRARY_ROOT=/data/audiobooks
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  client_node_modules:
  server_node_modules:
  audiobook_data:
  app_data:
