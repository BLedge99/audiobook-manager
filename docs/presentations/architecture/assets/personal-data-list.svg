<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">Candidate 06 — one list of personal-data tables</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">Spec 37 steps 6.1–6.2 · three hand-kept lists had already drifted apart.</text>

  <!-- the one module -->
  <rect x="410" y="84" width="380" height="80" rx="10" fill="#1a2740" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">server/src/gdpr/personal-data.ts</text>
  <text x="600" y="136" text-anchor="middle" font-size="10" fill="#cbd5e1">PERSONAL_DATA_ROWS · 24-month retention constant</text>

  <!-- three consumers -->
  <line x1="440" y1="164" x2="250" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="164" x2="600" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="760" y1="164" x2="950" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="240" width="320" height="90" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="82" y="268" font-size="11" font-weight="bold" fill="#e2e8f0">The export route</text>
  <text x="82" y="290" font-size="10" fill="#cbd5e1">Art. 15 / 20 — what leaves,</text>
  <text x="82" y="306" font-size="10" fill="#cbd5e1">exactly what's in the list</text>

  <rect x="440" y="240" width="320" height="90" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="462" y="268" font-size="11" font-weight="bold" fill="#e2e8f0">The erasure route</text>
  <text x="462" y="290" font-size="10" fill="#cbd5e1">Art. 17 — what dies, exactly</text>
  <text x="462" y="306" font-size="10" fill="#cbd5e1">what's in the list</text>

  <rect x="820" y="240" width="320" height="90" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="842" y="268" font-size="11" font-weight="bold" fill="#e2e8f0">The retention purge</text>
  <text x="842" y="290" font-size="10" fill="#cbd5e1">24 months, one constant,</text>
  <text x="842" y="306" font-size="10" fill="#cbd5e1">no second copy anywhere</text>

  <text x="600" y="376" text-anchor="middle" font-size="10" fill="#94a3b8">Before: webAuthnChallenge was erased but never exported — the lists disagreed and nothing noticed. The guard test now reads schema.prisma and fails if any model with a profileId is missing from the list.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
