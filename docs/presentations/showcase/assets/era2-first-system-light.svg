<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#292524">Stage 3 — the first full system (2026-10-02)</text>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#78716c">One container on the home network. Real files in, real pages out. The first shape the household actually used.</text>

  <!-- LAN -->
  <rect x="40" y="84" width="1120" height="470" rx="12" fill="#fdf6ee" stroke="#d8cbbd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="64" y="112" font-size="12" font-weight="bold" letter-spacing="2" fill="#d9480f">HOME NETWORK (LAN)</text>

  <!-- devices -->
  <rect x="80" y="150" width="230" height="130" rx="10" fill="#ffffff" stroke="#e3ddd2" stroke-width="1.5"/>
  <text x="100" y="178" font-size="12" font-weight="bold" fill="#292524">Phones &amp; laptops</text>
  <text x="100" y="200" font-size="11" fill="#44403c">Browser opens</text>
  <text x="100" y="218" font-size="11" fill="#44403c">http://&lt;lan-ip&gt;:3000</text>
  <text x="100" y="240" font-size="10.5" fill="#78716c">One household password</text>
  <text x="100" y="258" font-size="10.5" fill="#78716c">then a profile each</text>

  <!-- the one container -->
  <rect x="380" y="150" width="560" height="240" rx="10" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
  <text x="400" y="178" font-size="12" font-weight="bold" fill="#292524">One container :3000 (docker-compose.prod)</text>
  <text x="400" y="200" font-size="10.5" fill="#78716c">Fastify serves the built React app as static files, and the API at the same address</text>

  <rect x="400" y="216" width="240" height="70" rx="8" fill="#fdecd9" stroke="#e3ddd2"/>
  <text x="414" y="240" font-size="11" font-weight="bold" fill="#292524">The app itself</text>
  <text x="414" y="260" font-size="10" fill="#78716c">specs 01–14 in one day:</text>
  <text x="414" y="276" font-size="10" fill="#78716c">scanner · playback · auth · GDPR docs</text>

  <rect x="664" y="216" width="256" height="70" rx="8" fill="#fdecd9" stroke="#e3ddd2"/>
  <text x="678" y="240" font-size="11" font-weight="bold" fill="#292524">The guards</text>
  <text x="678" y="260" font-size="10" fill="#78716c">safePath root confinement</text>
  <text x="678" y="276" font-size="10" fill="#78716c">bounded ranges · schemas · security suite</text>

  <rect x="400" y="300" width="520" height="68" rx="8" fill="#fdecd9" stroke="#e3ddd2"/>
  <text x="414" y="324" font-size="11" font-weight="bold" fill="#292524">One scanner (ADR 005)</text>
  <text x="414" y="344" font-size="10" fill="#78716c">the duplicate implementation was deleted; pure grouping helpers got their own tests</text>

  <!-- media readonly -->
  <rect x="380" y="420" width="270" height="100" rx="10" fill="#fdf6ee" stroke="#ead9cc" stroke-width="1.5"/>
  <text x="400" y="448" font-size="12" font-weight="bold" fill="#292524">Media folder</text>
  <text x="400" y="470" font-size="10.5" fill="#44403c">Mounted read-only (:ro)</text>
  <text x="400" y="488" font-size="10.5" fill="#78716c">Never written, moved or deleted</text>

  <!-- sqlite -->
  <rect x="690" y="420" width="250" height="100" rx="10" fill="#fdf6ee" stroke="#ead9cc" stroke-width="1.5"/>
  <text x="710" y="448" font-size="12" font-weight="bold" fill="#292524">SQLite (Prisma)</text>
  <text x="710" y="470" font-size="10.5" fill="#44403c">The one database, everywhere</text>
  <text x="710" y="488" font-size="10.5" fill="#78716c">Profiles · progress · history · settings</text>

  <!-- arrows -->
  <line x1="310" y1="215" x2="372" y2="215" stroke="#d8cbbd" stroke-width="2" marker-end="url(#a)"/>
  <line x1="515" y1="390" x2="515" y2="412" stroke="#d8cbbd" stroke-width="2" marker-end="url(#a)"/>
  <line x1="790" y1="390" x2="790" y2="412" stroke="#d8cbbd" stroke-width="2" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
  </defs>

  <text x="600" y="600" text-anchor="middle" font-size="10.5" fill="#d8cbbd">Drawn from 5ebc03a (one container) · 467307c (scanner consolidation, ADR 005) · 4442789 (security suite) · 99f6dbb (household gate) · 5ebc03a</text>
</svg>
