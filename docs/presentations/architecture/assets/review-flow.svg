<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">How the 2026-11 reviews actually worked</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">Same method three times: 2026-11-11 (spec 37) · 2026-11-15 (spec 41) · 2026-11-16 (spec 42)</text>

  <!-- pipeline -->
  <rect x="30" y="84" width="200" height="150" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="46" y="112" font-size="11" font-weight="bold" fill="#f8fafc">1 · Fresh-context</text>
  <text x="46" y="132" font-size="11" font-weight="bold" fill="#f8fafc">review, read-only</text>
  <text x="46" y="156" font-size="10" fill="#cbd5e1">A reviewer with no memory</text>
  <text x="46" y="172" font-size="10" fill="#cbd5e1">of the code's story walks</text>
  <text x="46" y="188" font-size="10" fill="#cbd5e1">the whole tree, fresh eyes</text>
  <text x="46" y="212" font-size="9" fill="#94a3b8">It may not write code.</text>

  <line x1="230" y1="159" x2="262" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="270" y="84" width="200" height="150" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="286" y="112" font-size="11" font-weight="bold" fill="#f8fafc">2 · Candidates,</text>
  <text x="286" y="132" font-size="11" font-weight="bold" fill="#f8fafc">not commands</text>
  <text x="286" y="156" font-size="10" fill="#cbd5e1">Findings filed as numbered</text>
  <text x="286" y="172" font-size="10" fill="#cbd5e1">cards — “suspects”, with</text>
  <text x="286" y="188" font-size="10" fill="#cbd5e1">evidence and blast radius</text>
  <text x="286" y="212" font-size="9" fill="#94a3b8">Report stays in %TEMP%; findings move.</text>

  <line x1="470" y1="159" x2="502" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="510" y="84" width="200" height="150" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="526" y="112" font-size="11" font-weight="bold" fill="#f8fafc">3 · A spec, in-repo</text>
  <text x="526" y="136" font-size="10" fill="#cbd5e1">Cards become phases and</text>
  <text x="526" y="152" font-size="10" fill="#cbd5e1">steps, ordered by dependency</text>
  <text x="526" y="176" font-size="10" fill="#cbd5e1">Test first, observed failing;</text>
  <text x="526" y="192" font-size="10" fill="#cbd5e1">one step, one commit</text>
  <text x="526" y="214" font-size="9" fill="#94a3b8">ADRs written before the code they bless.</text>

  <line x1="710" y1="159" x2="742" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="750" y="84" width="200" height="150" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="766" y="112" font-size="11" font-weight="bold" fill="#f8fafc">4 · Green at every</text>
  <text x="766" y="132" font-size="11" font-weight="bold" fill="#f8fafc">step, honestly logged</text>
  <text x="766" y="156" font-size="10" fill="#cbd5e1">Both suites + typechecks</text>
  <text x="766" y="172" font-size="10" fill="#cbd5e1">after every step; deviations</text>
  <text x="766" y="188" font-size="10" fill="#cbd5e1">written down in the spec</text>

  <line x1="950" y1="159" x2="982" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="990" y="84" width="180" height="150" rx="10" fill="#101a17" stroke="#1f4034"/>
  <text x="1006" y="112" font-size="11" font-weight="bold" fill="#34d399">5 · Close-out</text>
  <text x="1006" y="136" font-size="10" fill="#cbd5e1">Re-measured numbers,</text>
  <text x="1006" y="152" font-size="10" fill="#cbd5e1">spec marked done,</text>
  <text x="1006" y="168" font-size="10" fill="#cbd5e1">roadmap ticked</text>
  <text x="1006" y="196" font-size="9" fill="#94a3b8">…or the spec says plainly what didn't run.</text>

  <text x="600" y="288" text-anchor="middle" font-size="11" fill="#cbd5e1">The review's report is never committed and never quoted as gospel — the spec is the record, the code is the proof.</text>
  <text x="600" y="312" text-anchor="middle" font-size="10.5" fill="#94a3b8">2026-11-11 review → spec 37 (11 phases, 45 steps, merged f024c6b) · 2026-11-15 review → spec 41 (9 cards, 10 phases) · 2026-11-16 review → spec 42 (9 cards + 1 defect, 11 phases)</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
