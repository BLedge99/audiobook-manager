<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No `maximum-scale` and no `user-scalable=no` here, on purpose. Blocking
      pinch-zoom is an accessibility regression and is not what stops Android's
      WebView from inflating layout text; `text-size-adjust: 100%` in
      src/index.css does that. Both are load-bearing.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14121a" />
    <title>Audiobook Manager</title>
    <script>
      /*
       * Apply the saved theme before first paint.
       *
       * Without this, a listener who chose dark mode gets a white flash every
       * time the app opens -- the CSS is only applied once the bundle runs, and
       * on the APK that is visible as a flash before the splash. "auto" is left
       * unset on purpose so the stylesheet's prefers-color-scheme block handles
       * it without JavaScript.
       */
      (function () {
        try {
          var choice = localStorage.getItem("bookle-theme");
          if (choice === "light" || choice === "dark") {
            document.documentElement.setAttribute("data-theme", choice);
          }
        } catch (error) {
          /* private mode or storage disabled: fall back to the system theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
