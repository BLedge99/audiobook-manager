<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">2026-11-16, HIGH finding 1 — the cover download</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">SSRF (server-side request forgery): the server fetches a cover URL supplied by a provider. Providers can be wrong — or hostile. The fix treats every URL as untrusted.</text>

  <!-- flow -->
  <rect x="40" y="88" width="180" height="90" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="62" y="120" font-size="11" font-weight="bold" fill="#f8fafc">Provider URL</text>
  <text x="62" y="142" font-size="9" fill="#cbd5e1">from LibriVox /</text>
  <text x="62" y="158" font-size="9" fill="#cbd5e1">Open Library / Google</text>

  <line x1="220" y1="133" x2="252" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="260" y="88" width="210" height="90" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="280" y="114" font-size="10.5" font-weight="bold" fill="#f8fafc">Normalise</text>
  <text x="280" y="134" font-size="9" fill="#cbd5e1">strip IPv6 brackets · expand</text>
  <text x="280" y="150" font-size="9" fill="#cbd5e1">IPv4-mapped · catch 2130706433,</text>
  <text x="280" y="166" font-size="9" fill="#cbd5e1">0x7f.…, 127.1, localhost.</text>

  <line x1="470" y1="133" x2="502" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="510" y="88" width="210" height="90" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="530" y="114" font-size="10.5" font-weight="bold" fill="#f8fafc">Check the host</text>
  <text x="530" y="134" font-size="9" fill="#cbd5e1">loopback · private · link-local</text>
  <text x="530" y="150" font-size="9" fill="#cbd5e1">ULA · unspecified — all refused;</text>
  <text x="530" y="166" font-size="9" fill="#cbd5e1">DNS answers must be global too</text>

  <line x1="720" y1="133" x2="752" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="760" y="88" width="200" height="90" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="780" y="114" font-size="10.5" font-weight="bold" fill="#f8fafc">Follow safely</text>
  <text x="780" y="134" font-size="9" fill="#cbd5e1">max 5 redirects, each hop</text>
  <text x="780" y="150" font-size="9" fill="#cbd5e1">re-validated; stream body</text>
  <text x="780" y="166" font-size="9" fill="#cbd5e1">with a hard byte counter</text>

  <line x1="960" y1="133" x2="992" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1000" y="88" width="160" height="90" rx="10" fill="#101a17" stroke="#1f4034"/>
  <text x="1018" y="114" font-size="10.5" font-weight="bold" fill="#34d399">Store</text>
  <text x="1018" y="134" font-size="9" fill="#cbd5e1">content-type allowlist</text>
  <text x="1018" y="150" font-size="9" fill="#cbd5e1">(jpeg · png · webp) + magic</text>
  <text x="1018" y="166" font-size="9" fill="#cbd5e1">bytes verified</text>

  <!-- why it matters -->
  <rect x="60" y="226" width="1080" height="80" rx="10" fill="#1a1410" stroke="#40341f"/>
  <text x="84" y="254" font-size="11" font-weight="bold" fill="#f6c453">WHY IT MATTERED</text>
  <text x="84" y="276" font-size="10" fill="#cbd5e1">An unvalidated fetcher on a server inside the household's network can be pointed at routers, NAS boxes, the Supabase metadata service and every other internal address — this is the classic cloud credential theft shape.</text>
  <text x="84" y="293" font-size="10" fill="#cbd5e1">The house is the trust boundary; the provider is not. Every hop is checked, the body is capped, and the stored bytes must really be an image.</text>

  <text x="600" y="352" text-anchor="middle" font-size="10" fill="#94a3b8">Cover art is fetched server-side because providers don't allow hotlinking reliably. It is also the one path where an attacker-influenced URL enters the server — hence the scrutiny.</text>
  <text x="600" y="374" text-anchor="middle" font-size="10" fill="#94a3b8">Implemented as a rewrite of server/src/metadata/cover.ts with a new test suite (+296 lines). Commit 8b9b445, 2026-11-16 — the first HIGH fix of the day.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
