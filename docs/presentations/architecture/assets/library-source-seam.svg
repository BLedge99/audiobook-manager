<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">Candidates 02b + 03 — two shelves, one source</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">Spec 37 steps 3.1–3.3 · the two-library merge used to be hand-written inside App.tsx, twice, with an inline key format.</text>

  <!-- interface -->
  <rect x="370" y="84" width="460" height="96" rx="10" fill="#1a2740" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">LibrarySource (the interface)</text>
  <text x="600" y="136" text-anchor="middle" font-size="10" fill="#cbd5e1">books · loading · refreshing · error · refresh()</text>
  <text x="600" y="156" text-anchor="middle" font-size="9" fill="#94a3b8">client/src/local/librarySource.ts — new, 2026-11-11</text>

  <!-- adapters -->
  <line x1="470" y1="180" x2="290" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="730" y1="180" x2="910" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="238" width="420" height="120" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="104" y="268" font-size="11.5" font-weight="bold" fill="#f8fafc">useLibrary — the server shelf</text>
  <text x="104" y="292" font-size="10" fill="#cbd5e1">REST + ETag conditional gets, merged with</text>
  <text x="104" y="308" font-size="10" fill="#cbd5e1">favourites; keeps the online shelf fresh</text>
  <text x="104" y="336" font-size="9" fill="#94a3b8">unchanged behaviour — only the shape was unified</text>

  <rect x="700" y="238" width="420" height="120" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="724" y="268" font-size="11.5" font-weight="bold" fill="#f8fafc">useDeviceLibrary — the device shelf</text>
  <text x="724" y="292" font-size="10" fill="#cbd5e1">IndexedDB replica of the library, rows keyed</text>
  <text x="724" y="308" font-size="10" fill="#cbd5e1">serverId#bookId; downloads stored on disk</text>
  <text x="724" y="336" font-size="9" fill="#94a3b8">unchanged behaviour — only the shape was unified</text>

  <!-- merge -->
  <text x="600" y="404" text-anchor="middle" font-size="10" fill="#94a3b8">mergeShelves(sources, offline): server copy wins a key collision · the device shelf survives for servers the phone can't reach · when the server answers, the device shelf drops out of the merge</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
