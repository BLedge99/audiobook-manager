<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">Spec 41, card 1 — the live data bug</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">2026-11-15 audit · the one defect that could destroy files, not just state.</text>

  <!-- before -->
  <rect x="60" y="84" width="480" height="230" rx="10" fill="#1a1410" stroke="#40341f"/>
  <text x="84" y="114" font-size="11.5" font-weight="bold" fill="#f6c453">BEFORE — rows per server, files per bare id</text>
  <rect x="84" y="132" width="190" height="44" rx="8" fill="#131c2b" stroke="#334155"/>
  <text x="98" y="152" font-size="10" fill="#e2e8f0">replica row: a.example#7</text>
  <text x="98" y="168" font-size="9" fill="#94a3b8">per-server — correct</text>
  <rect x="300" y="132" width="190" height="44" rx="8" fill="#131c2b" stroke="#334155"/>
  <text x="314" y="152" font-size="10" fill="#e2e8f0">replica row: b.example#7</text>
  <text x="314" y="168" font-size="9" fill="#94a3b8">per-server — correct</text>
  <text x="84" y="204" font-size="10.5" fill="#cbd5e1">…but the audio lived at <tspan fill="#f6c453">books/7/…</tspan> —</text>
  <text x="84" y="224" font-size="10.5" fill="#cbd5e1">one folder per book id, shared by every server.</text>
  <text x="84" y="250" font-size="10" fill="#94a3b8">Server B's download of book 7 overwrote server A's.</text>
  <text x="84" y="268" font-size="10" fill="#94a3b8">“Remove from library” on A deleted B's audio files.</text>
  <text x="84" y="286" font-size="10" fill="#94a3b8">recoverBooks adopted orphans by bare numeric id.</text>

  <line x1="540" y1="199" x2="580" y2="199" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- after -->
  <rect x="590" y="84" width="550" height="230" rx="10" fill="#101a17" stroke="#1f4034"/>
  <text x="614" y="114" font-size="11.5" font-weight="bold" fill="#34d399">AFTER — books/srv-&lt;hash&gt;/&lt;bookId&gt;/…</text>
  <rect x="614" y="132" width="226" height="40" rx="8" fill="#131c2b" stroke="#334155"/>
  <text x="628" y="150" font-size="9.5" fill="#e2e8f0">books/srv-9f2c…/7/…</text>
  <text x="628" y="166" font-size="8.5" fill="#94a3b8">server A's shelf</text>
  <rect x="856" y="132" width="226" height="40" rx="8" fill="#131c2b" stroke="#334155"/>
  <text x="870" y="150" font-size="9.5" fill="#e2e8f0">books/srv-41bd…/7/…</text>
  <text x="870" y="166" font-size="8.5" fill="#94a3b8">server B's shelf — different hash</text>
  <text x="614" y="200" font-size="10.5" fill="#cbd5e1"><tspan fill="#34d399">•</tspan> Directory name is a SHA-256 of the serverId (16 hex) —</text>
  <text x="614" y="218" font-size="10.5" fill="#cbd5e1">  a LAN hostname never lands on disk or in a backup</text>
  <text x="614" y="240" font-size="10.5" fill="#cbd5e1"><tspan fill="#34d399">•</tspan> Recovery, unclaimed scans and removal all keyed by shelf</text>
  <text x="614" y="262" font-size="10.5" fill="#cbd5e1"><tspan fill="#34d399">•</tspan> Completes ADR 020 / spec 30, which decided the</text>
  <text x="614" y="280" font-size="10.5" fill="#cbd5e1">  composite key but never got a file layer to go with it</text>

  <text x="600" y="376" text-anchor="middle" font-size="10" fill="#94a3b8">Rows and files now agree on what “this server's copy of book 7” means — two shelves can never overwrite each other's audio.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
