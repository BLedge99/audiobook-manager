<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="420" fill="#0b1117"/>
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">Candidate 05 — who wins when sources disagree</text>
  <text x="600" y="54" text-anchor="middle" font-size="10.5" fill="#94a3b8">Spec 37 steps 5.1–5.2 · ADR 028 · the chain was never actually enforced before this change.</text>

  <!-- chain -->
  <rect x="390" y="82" width="420" height="60" rx="8" fill="#101a17" stroke="#1f4034" stroke-width="2"/>
  <text x="600" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">1 · User override (locked fields)</text>
  <text x="600" y="127" text-anchor="middle" font-size="9.5" fill="#94a3b8">a human said “this field is mine” — nothing touches it</text>

  <line x1="600" y1="142" x2="600" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390" y="162" width="420" height="60" rx="8" fill="#131c2b" stroke="#334155"/>
  <text x="600" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">2 · Enriched (provider catalogues)</text>
  <text x="600" y="207" text-anchor="middle" font-size="9.5" fill="#94a3b8">curated values from LibriVox / Open Library / Google Books</text>

  <line x1="600" y1="222" x2="600" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390" y="242" width="420" height="60" rx="8" fill="#131c2b" stroke="#334155"/>
  <text x="600" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">3 · Embedded tag (the file itself)</text>
  <text x="600" y="287" text-anchor="middle" font-size="9.5" fill="#94a3b8">what music-metadata read off disk</text>

  <line x1="600" y1="302" x2="600" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390" y="322" width="420" height="40" rx="8" fill="#131c2b" stroke="#334155" stroke-dasharray="5 4"/>
  <text x="600" y="346" text-anchor="middle" font-size="10.5" fill="#94a3b8">4 · Derived (filename/folder) — reserved, never built</text>

  <!-- side notes -->
  <rect x="60" y="84" width="280" height="140" rx="10" fill="#131c2b" stroke="#334155"/>
  <text x="80" y="110" font-size="10.5" font-weight="bold" fill="#f8fafc">What the review found</text>
  <text x="80" y="132" font-size="9.5" fill="#cbd5e1">precedence.ts existed and was tested —</text>
  <text x="80" y="148" font-size="9.5" fill="#cbd5e1">and nothing in production imported it.</text>
  <text x="80" y="172" font-size="9.5" fill="#cbd5e1">The rule was re-derived at three call</text>
  <text x="80" y="188" font-size="9.5" fill="#cbd5e1">sites and re-implemented twice in app.ts.</text>

  <rect x="860" y="84" width="280" height="140" rx="10" fill="#101a17" stroke="#1f4034"/>
  <text x="880" y="110" font-size="10.5" font-weight="bold" fill="#34d399">What changed (ADR 028)</text>
  <text x="880" y="132" font-size="9.5" fill="#cbd5e1">Enriched now beats embedded — a rescan</text>
  <text x="880" y="148" font-size="9.5" fill="#cbd5e1">no longer discards curated data.</text>
  <text x="880" y="172" font-size="9.5" fill="#cbd5e1">The legacy metadataSource="user"</text>
  <text x="880" y="188" font-size="9.5" fill="#cbd5e1">sentinel is retired; overrides are explicit.</text>

  <text x="600" y="398" text-anchor="middle" font-size="10" fill="#94a3b8">“Last writer wins” was the old behaviour: the scanner overwrote enriched titles with embedded ones, and only user overrides survived a rescan.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
