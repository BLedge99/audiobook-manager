<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Arial, Helvetica, sans-serif">
  <rect width="1120" height="700" fill="#1e293b"/>
  <!-- browser frame -->
  <rect x="16" y="16" width="1088" height="668" rx="12" fill="#0b1117" stroke="#334155" stroke-width="2"/>
  <rect x="16" y="16" width="1088" height="40" rx="12" fill="#111827"/>
  <circle cx="40" cy="36" r="6" fill="#475569"/><circle cx="60" cy="36" r="6" fill="#475569"/><circle cx="80" cy="36" r="6" fill="#475569"/>
  <rect x="120" y="26" width="500" height="20" rx="10" fill="#1f2937"/>
  <text x="132" y="40" font-size="12" fill="#94a3b8">http://localhost:5173</text>

  <!-- header: cyan chip + wordmark + refresh -->
  <rect x="16" y="56" width="1088" height="64" fill="#0b1117" stroke="#1e293b"/>
  <rect x="48" y="72" width="32" height="32" fill="#22d3ee"/>
  <text x="56" y="94" font-size="18" fill="#020617">=</text>
  <text x="94" y="80" font-size="9" letter-spacing="3" fill="#22d3ee">LOCAL LIBRARY</text>
  <text x="94" y="101" font-size="17" font-weight="bold" fill="#ffffff">Audiobook Manager</text>
  <circle cx="1048" cy="88" r="10" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M1043 84 a6 6 0 1 1 2 4" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- hero row: headline left, scan button right -->
  <text x="48" y="160" font-size="12" font-weight="600" fill="#22d3ee">Your collection</text>
  <text x="48" y="205" font-size="34" font-weight="bold" fill="#ffffff">Browse your books.</text>
  <text x="48" y="232" font-size="12" fill="#94a3b8">Scan local folders to bring your audiobook metadata and artwork into one calm shelf.</text>
  <rect x="848" y="175" width="224" height="44" fill="#22d3ee"/>
  <text x="960" y="203" font-size="15" font-weight="600" fill="#020617" text-anchor="middle">Scan library</text>
  <line x1="48" y1="278" x2="1072" y2="278" stroke="#1e293b"/>

  <!-- library folders section -->
  <text x="48" y="312" font-size="15" font-weight="600" fill="#e2e8f0">Library folders</text>
  <text x="1010" y="312" font-size="12" fill="#22d3ee" text-anchor="end">Add folder</text>
  <rect x="48" y="326" width="500" height="56" fill="#0f172a" stroke="#1e293b"/>
  <text x="64" y="350" font-size="13" font-weight="600" fill="#e2e8f0">My audiobooks</text>
  <text x="64" y="370" font-size="10" fill="#64748b">D:\Audio -- complete</text>
  <rect x="580" y="326" width="490" height="56" fill="#0f172a" stroke="#1e293b"/>
  <text x="596" y="350" font-size="13" font-weight="600" fill="#e2e8f0">LibriVox downloads</text>
  <text x="596" y="370" font-size="10" fill="#64748b">D:\LibriVox -- idle</text>

  <!-- all audiobooks -->
  <text x="48" y="430" font-size="21" font-weight="bold" fill="#ffffff">All audiobooks</text>
  <text x="48" y="452" font-size="10" fill="#64748b">12 titles in your library</text>
  <!-- grid of 5 cards, aspect 2/3 covers -->
  <g>
    <rect x="48" y="466" width="176" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="48" y="466" width="176" height="96" fill="#334155"/>
    <text x="60" y="586" font-size="11" font-weight="600" fill="#e2e8f0">The Art of War</text>
    <text x="60" y="604" font-size="9" fill="#64748b">Sun Tzu</text>
  </g>
  <g>
    <rect x="248" y="466" width="176" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="248" y="466" width="176" height="96" fill="#334155"/>
    <text x="260" y="586" font-size="11" font-weight="600" fill="#e2e8f0">Pride and Prejudice</text>
    <text x="260" y="604" font-size="9" fill="#64748b">Jane Austen</text>
  </g>
  <g>
    <rect x="448" y="466" width="176" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="448" y="466" width="176" height="96" fill="#334155"/>
    <text x="460" y="586" font-size="11" font-weight="600" fill="#e2e8f0">A Study in Scarlet</text>
    <text x="460" y="604" font-size="9" fill="#64748b">Arthur Conan Doyle</text>
  </g>
  <g>
    <rect x="648" y="466" width="176" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="648" y="466" width="176" height="96" fill="#334155"/>
    <text x="660" y="586" font-size="11" font-weight="600" fill="#e2e8f0">The Time Machine</text>
    <text x="660" y="604" font-size="9" fill="#64748b">H.G. Wells</text>
  </g>
  <g>
    <rect x="848" y="466" width="224" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <rect x="848" y="466" width="224" height="96" fill="#334155"/>
    <text x="860" y="586" font-size="11" font-weight="600" fill="#e2e8f0">Flatland</text>
    <text x="860" y="604" font-size="9" fill="#64748b">Edwin A. Abbott</text>
  </g>

  <!-- footer -->
  <line x1="48" y1="652" x2="1072" y2="652" stroke="#1e293b"/>
  <text x="560" y="672" font-size="9" fill="#475569" text-anchor="middle">Audiobook Manager -- local-first listening</text>
</svg>
