services:
  client:
    depends_on:
      server:
        condition: service_healthy
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.client
    working_dir: /app/client
    command: npm run dev -- --host
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://server:3000

  server:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.server
    working_dir: /app/server
    # `prisma migrate deploy`, NOT `prisma db push`.
    #
    # `db push` creates the schema but records no migration history and
    # **cannot run a data migration** -- and spec 27's migration has to move
    # data (every existing profile is given every book). Production has always
    # used `migrate deploy` (Dockerfile.prod); using `db push` here meant dev
    # and production disagreed about what the database contained, which is the
    # worst possible place for that to show up.
    #
    # The exit code is echoed rather than checked, as before, so a failure is
    # visible in the logs without taking the whole stack down.
    command: sh -c "echo '[compose] starting prisma generate'; npx prisma generate; echo '[compose] prisma generate exited with code '$$?; echo '[compose] applying migrations'; npx prisma migrate deploy; echo '[compose] prisma migrate deploy exited with code '$$?; echo '[compose] starting Fastify'; npm run dev"
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
      - ./test:/test:ro
      - audiobook_data:/data/audiobooks
      - app_data:/app/data
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:/app/data/library.db
      - LIBRARY_ROOT=/data/audiobooks
      # The E2E security suite asserts that unauthenticated API calls are
      # rejected, which only holds when auth is actually enabled.
      - APP_PASSWORD=${APP_PASSWORD:-household}
      # Development-only signing key; production Compose requires a unique
      # MEDIA_TOKEN_SECRET from the private .env file.
      - MEDIA_TOKEN_SECRET=${MEDIA_TOKEN_SECRET:-development-only-media-token-secret-32-bytes}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      # Spec 28: passkeys are WebAuthn, so the RP id and the page origin must
      # agree. Vite serves the client on localhost:5173, which is a secure
      # context; the household deployment overrides both with books.home.arpa.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  client_node_modules:
  server_node_modules:
  audiobook_data:
  app_data:
